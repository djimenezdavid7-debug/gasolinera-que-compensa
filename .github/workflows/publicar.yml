# Cada hora: descarga los precios oficiales, comprueba el cálculo y publica la web en GitHub Pages.
# Los datos NO se guardan en el repositorio (no lo engordan): van solo en la web publicada.
name: Actualizar precios y publicar

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests del cálculo
        run: node --test tests/calculo.test.mjs
      - name: Descargar precios oficiales
        run: python scripts/actualizar.py docs/data/estaciones.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
